name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libgl1-mesa-dev libgles2-mesa-dev libsdl2-dev \
            libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libmtdev-dev libxkbcommon-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install kivy==2.3.0 pillow==10.4.0 pyinstaller==6.11.1

      - name: Build Linux executable
        run: |
          pyinstaller \
            --name "EEG_Meditation_Trainer" \
            --noconfirm \
            --clean \
            --onedir \
            --noconsole \
            --strip \
            --exclude-module tkinter \
            --exclude-module _tkinter \
            --exclude-module unittest \
            --exclude-module pytest \
            --hidden-import app \
            --hidden-import app.ui \
            --hidden-import app.ui.app_manager \
            --hidden-import app.ui.live_session \
            --hidden-import app.ui.raw_eeg_screen \
            --hidden-import app.ui.settings_screen \
            --hidden-import app.ui.timer_screen \
            --hidden-import app.ui.diary_screen \
            --hidden-import app.ui.analytics_screen \
            --hidden-import app.ui.profile_screen \
            --hidden-import app.eeg \
            --hidden-import app.eeg.mock_stream \
            --hidden-import app.eeg.mock_stream_v2 \
            --hidden-import app.eeg.buffer \
            --hidden-import app.metrics \
            --hidden-import app.metrics.engine \
            --hidden-import app.metrics.custom_formula \
            --hidden-import app.metrics.noise_detector \
            --hidden-import app.audio_feedback \
            --hidden-import app.audio_feedback.noise \
            --hidden-import app.session \
            --hidden-import app.session.manager \
            --hidden-import app.storage \
            --hidden-import app.storage.database \
            --hidden-import app.analytics \
            --hidden-import app.analytics.aggregator \
            --hidden-import app.config \
            --hidden-import app.logger \
            --hidden-import kivy.core.window.window_sdl2 \
            --hidden-import kivy.core.text.text_sdl2 \
            --hidden-import kivy.core.image.img_sdl2 \
            --hidden-import kivy.core.audio.audio_sdl2 \
            --hidden-import kivy.core.clipboard.clipboard_sdl2 \
            --hidden-import kivy.graphics.opengl \
            --hidden-import kivy.graphics.opengl_utils \
            main.py

      - name: Package Linux build
        run: |
          tar czf EEG_Meditation_Trainer_linux_x64.tar.gz -C dist EEG_Meditation_Trainer

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: EEG_Meditation_Trainer_linux_x64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install kivy[base]==2.3.0 kivy_deps.sdl2 kivy_deps.glew
          pip install pillow==10.4.0 pyserial==3.5 pyinstaller==6.11.1 pywin32

      - name: Remove incompatible PyInstaller kivy hook
        run: python -c "import os, PyInstaller; p=os.path.join(os.path.dirname(PyInstaller.__file__), 'hooks', 'hook-kivy.py'); os.remove(p); print(f'Removed {p}')"

      - name: Build Windows executable
        run: python -m PyInstaller eeg_meditation.spec --noconfirm
        env:
          KIVY_DOC: '1'

      - name: Package Windows build
        run: Compress-Archive -Path dist\EEG_Meditation_Trainer -DestinationPath EEG_Meditation_Trainer_windows_x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: EEG_Meditation_Trainer_windows_x64.zip

  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev automake openjdk-17-jdk lld

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==3.0.10

      - name: Build Android APK
        run: |
          yes | buildozer android debug
        timeout-minutes: 45
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

      - name: Find APK
        id: apk
        run: |
          APK=$(find bin -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found in bin/"
            ls -la bin/ 2>/dev/null || echo "bin/ directory does not exist"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK ($(du -h "$APK" | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: ${{ steps.apk.outputs.path }}

  release:
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-build

      - uses: actions/download-artifact@v4
        with:
          name: windows-build

      - uses: actions/download-artifact@v4
        with:
          name: android-build

      - name: List artifacts
        run: ls -lah

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            EEG_Meditation_Trainer_linux_x64.tar.gz
            EEG_Meditation_Trainer_windows_x64.zip
            *.apk
