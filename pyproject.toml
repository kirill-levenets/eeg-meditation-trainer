[tool.ruff]
preview = true
target-version = "py311"

[tool.ruff.lint]
select = [
    # Errors & correctness
    "F821",    # undefined-name
    "F401",    # unused-import
    "F811",    # redefined-while-unused
    "E722",    # bare-except (syntax-level)

    # Modern Python style
    "PLC0415", # import-outside-toplevel — no imports inside functions
    "T201",    # print — use logger, not print()
    "UP006",   # non-pep585-annotation — list[str] not List[str]
    "UP007",   # non-pep604-annotation — X | None not Optional[X]
    "UP035",   # deprecated-import — remove `from typing import List` etc.
    "TID252",  # relative-imports — always absolute imports
    "S105",    # hardcoded-password-string
    "S106",    # hardcoded-password-func-arg

    # Common bugs
    "B006",    # mutable-default-argument
    "B007",    # unused-loop-variable
    "B018",    # useless-expression

    # Code quality
    "BLE001",  # blind-except — don't catch bare Exception without logging
    "ASYNC100",# missing-await — coroutine created but never awaited
    "SIM102",  # collapsible-if
    "SIM118",  # in-dict-keys — use `key in dict` not `key in dict.keys()`
    "SIM401",  # use dict.get instead of if/else
    "PIE790",  # unnecessary-placeholder — redundant `pass`
    "C4",      # unnecessary list/dict comprehension patterns
    "RET504",  # unnecessary-assign-before-return
    "RUF019",  # unnecessary-key-check
    "RUF100",  # unused-noqa

    # Import hygiene
    "I001",    # unsorted-imports (isort)

    # Complexity — relaxed thresholds for Kivy UI code
    "C901",    # function too complex (cyclomatic complexity)
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0913", # too many function arguments
    "PLR0915", # too many statements in function

    # Formatting
    "W292",    # no-newline-at-end-of-file
]

ignore = [
    "E501",    # line-too-long
    "W293",    # blank-line-with-whitespace
    "E302",    # expected-2-blank-lines
    "W291",    # trailing-whitespace
    "F541",    # f-string-missing-placeholders
    "E203",    # whitespace-before-punctuation
    "RUF001",  # ambiguous-unicode-character-string — false positives on Cyrillic text
    "RUF002",  # ambiguous-unicode-character-docstring — same
    "RUF003",  # ambiguous-unicode-character-comment — same
]

[tool.ruff.lint.per-file-ignores]
# Tests: print, broad asserts, per-test imports
"tests/*" = ["T201", "BLE001", "PLC0415"]
# __main__ blocks use print()
"app/eeg/mock_stream.py" = ["T201"]
"app/eeg/mock_stream_v2.py" = ["T201"]
"app/session/manager.py" = ["T201", "BLE001"]
# BT protocol: broad except, lazy platform imports, complex parser
"app/eeg/neurosky_stream.py" = ["T201", "PLC0415", "BLE001", "PLR0912"]
# Audio: broad except + lazy Kivy SoundLoader import
"app/audio_feedback/noise.py" = ["T201", "PLC0415", "BLE001"]
# DB: lazy json import, print in __main__
"app/storage/database.py" = ["T201", "PLC0415"]
# Android MediaStore: lazy pyjnius import, broad except for platform safety
"app/storage/android_share.py" = ["PLC0415", "BLE001"]
# Android SAF: lazy pyjnius import, broad except for platform safety
"app/storage/android_saf.py" = ["PLC0415", "BLE001"]
# AST validator/evaluator: deeply branched by design
"app/metrics/custom_formula.py" = ["BLE001", "PLR0911", "PLR0912"]
# Android storage resolution
"app/config.py" = ["PLC0415"]
# App manager: Android pyjnius lazy import, broad except, threading
"app/ui/app_manager.py" = ["PLC0415", "BLE001", "PLR0912", "PLR0915"]
# UI screens: _build_ui methods are long but flat widget construction
"app/ui/live_session.py" = ["PLR0915", "BLE001"]
"app/ui/settings_screen.py" = ["PLR0915"]
# diary: Android-only `copy_to_documents` lazy import inside Android branch
"app/ui/diary_screen.py" = ["PLC0415", "BLE001", "PLR0915"]
# Graph _redraw: inherently complex rendering loop
"app/ui/raw_eeg_screen.py" = ["C901", "PLR0912", "PLR0915"]
# Theme: broad except in listeners
"app/ui/theme.py" = ["BLE001"]

[tool.ruff.lint.mccabe]
max-complexity = 30  # default 10; relaxed for parser/eval/tick loops

[tool.ruff.lint.pylint]
max-args = 12        # default 5; Kivy widgets take many kwargs
max-returns = 8      # default 6
max-branches = 15    # default 12
max-statements = 80  # default 50; _build_ui methods are long but flat

[tool.ruff.lint.isort]
known-first-party = ["app"]