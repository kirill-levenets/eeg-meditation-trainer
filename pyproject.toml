[tool.ruff]
preview = true
target-version = "py311"
line-length = 120  # the code's width; isort wraps at it (the length check itself, E501, is off)

[tool.ruff.lint]
select = [
    # Errors & correctness
    "F821",    # undefined-name
    "F401",    # unused-import
    "F811",    # redefined-while-unused
    "E722",    # bare-except (syntax-level)

    # Modern Python style
    "PLC0415", # import-outside-toplevel — no imports inside functions
    "T201",    # print — use logger, not print()
    "UP006",   # non-pep585-annotation — list[str] not List[str]
    "UP007",   # non-pep604-annotation — X | Y not Union[X, Y]
    "UP045",   # non-pep604-annotation-optional — X | None not Optional[X]
    "UP035",   # deprecated-import — remove `from typing import List` etc.
    "TID252",  # relative-imports — always absolute imports
    "S105",    # hardcoded-password-string
    "S106",    # hardcoded-password-func-arg

    # Common bugs
    "B006",    # mutable-default-argument
    "B007",    # unused-loop-variable
    "B018",    # useless-expression

    # Code quality
    "BLE001",  # blind-except — don't catch bare Exception without logging
    "S110",    # try-except-pass — a broad except that only passes hides the failure
    "ASYNC100",# missing-await — coroutine created but never awaited
    "SIM102",  # collapsible-if
    "SIM118",  # in-dict-keys — use `key in dict` not `key in dict.keys()`
    "SIM401",  # use dict.get instead of if/else
    "PIE790",  # unnecessary-placeholder — redundant `pass`
    "C4",      # unnecessary list/dict comprehension patterns
    "RET504",  # unnecessary-assign-before-return
    "RUF019",  # unnecessary-key-check
    "RUF100",  # unused-noqa

    # Import hygiene
    "I001",    # unsorted-imports (isort)

    # Complexity — relaxed thresholds for Kivy UI code
    "C901",    # function too complex (cyclomatic complexity)
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0913", # too many function arguments
    "PLR0915", # too many statements in function

    # Formatting
    "W292",    # no-newline-at-end-of-file
]

ignore = [
    "E501",    # line-too-long
    "W293",    # blank-line-with-whitespace
    "E302",    # expected-2-blank-lines
    "W291",    # trailing-whitespace
    "F541",    # f-string-missing-placeholders
    "E203",    # whitespace-before-punctuation
    "RUF001",  # ambiguous-unicode-character-string — false positives on Cyrillic text
    "RUF002",  # ambiguous-unicode-character-docstring — same
    "RUF003",  # ambiguous-unicode-character-comment — same
]

[tool.ruff.lint.per-file-ignores]
# An import kept inside a function in app/ says why on its line (# noqa: PLC0415 - reason), never through a file-wide ignore.
# Tests: print, broad asserts, per-test imports
"tests/*" = ["T201", "BLE001", "PLC0415"]
# Session stop: a broad except around the failure alert, which must not lose the stats (logged)
"app/session/manager.py" = ["BLE001"]
# BT link: broad except around each socket, JNI and serial call (logged)
"app/eeg/neurosky_stream.py" = ["BLE001"]
"app/eeg/bt_links.py" = ["BLE001"]
# Audio: broad except
"app/audio_feedback/noise.py" = ["BLE001"]
# The platform's players: broad except around each MediaPlayer or SoundLoader call (logged)
"app/audio_feedback/players.py" = ["BLE001"]
# A one-shot's slot: broad except around building, playing and releasing its player (logged)
"app/audio_feedback/one_shot.py" = ["BLE001"]
# Android MediaStore: broad except for platform safety
"app/storage/android_share.py" = ["BLE001"]
# Android SAF: broad except for platform safety
"app/storage/android_saf.py" = ["BLE001"]
# pyjnius helpers: broad except while trying screens in turn (logged)
"app/android_jni.py" = ["BLE001"]
# The session's keep-awake: broad except around each Android call (logged)
"app/keep_awake.py" = ["BLE001"]
# The native toast: broad except around the Android call (logged)
"app/ui/toast.py" = ["BLE001"]
# The maker's power screens: broad except around building them through pyjnius (logged, then a toast)
"app/ui/power_exemption.py" = ["BLE001"]
# App manager: a broad except around each step whose failure must not stop the app (logged)
"app/ui/app_manager.py" = ["BLE001"]
# Backup/restore (moved from app_manager): broad except around SAF / pyjnius / file I/O, each logged or reported
"app/ui/backup_flow.py" = ["BLE001"]
# Theme: broad except in listeners
"app/ui/theme.py" = ["BLE001"]

[tool.ruff.lint.mccabe]
max-complexity = 30  # default 10; relaxed for parser/eval/tick loops

[tool.ruff.lint.pylint]
max-args = 12        # default 5; Kivy widgets take many kwargs
max-returns = 8      # default 6
max-branches = 15    # default 12
max-statements = 80  # default 50; _build_ui methods are long but flat

[tool.ruff.lint.isort]
known-first-party = ["app"]